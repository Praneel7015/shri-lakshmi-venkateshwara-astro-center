# Build the website and publish it to the `deploy` branch.
#
# The `deploy` branch always holds the finished, ready-to-serve website
# (the contents of out/). A web server only ever needs:
#     git clone -b deploy <repo> public_html     (once)
#     git pull                                   (to update)
# so moving to a new server is a clone, nothing else. See README → Hosting.
#
# Runs when:
#   • code is pushed to main
#   • the client publishes in the Studio (Sanity webhook → "sanity-publish", see README)
#   • every night at 00:30 IST (makes scheduled blog posts go live)
#   • you press "Run workflow" on GitHub
name: Build & deploy

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [sanity-publish]
  schedule:
    - cron: '0 19 * * *' # 19:00 UTC = 00:30 IST
  workflow_dispatch:

# Several publishes in a row → only the latest build runs.
concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: write # to push the `deploy` branch

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
      NEXT_PUBLIC_SANITY_DATASET: ${{ vars.SANITY_DATASET || 'production' }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
      NEXT_PUBLIC_WEB3FORMS_KEY: ${{ secrets.WEB3FORMS_KEY }}
      HAS_SSH: ${{ secrets.SSH_HOST != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            studio/package-lock.json

      - name: Install
        run: |
          npm ci
          npm ci --prefix studio

      - name: Build website + editor
        run: npm run build

      - name: Publish to the deploy branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Check out the deploy branch next to the code (create it on the first run).
          if git ls-remote --exit-code --heads origin deploy >/dev/null; then
            git fetch --depth 1 origin deploy
            git worktree add deploy-tree FETCH_HEAD
            git -C deploy-tree checkout -B deploy
          else
            git worktree add --orphan -b deploy deploy-tree
          fi

          # Replace its contents with the fresh build.
          rsync -a --delete --exclude .git out/ deploy-tree/
          cd deploy-tree
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed since the last deploy."
            exit 0
          fi
          git commit -q -m "Deploy ${GITHUB_SHA::7} (${{ github.event_name }})"
          git push origin deploy

      # Optional: tell the server to pull right away. Without these secrets the
      # server picks the update up on its next scheduled `git pull` (see README).
      - name: Update the server now
        if: env.HAS_SSH == 'true'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SITE_DIR: ${{ vars.SITE_DIR || 'public_html' }}
        run: |
          mkdir -p ~/.ssh && echo "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" "cd $SITE_DIR && git pull --ff-only -q"
